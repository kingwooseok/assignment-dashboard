name: CI - Test and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: kingwooseok/assignment-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test FastAPI and calendar behavior
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - uses: docker/setup-buildx-action@v4
      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and verify actual API
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker run -d --name assignment-ci -p 127.0.0.1:18000:8000 "$IMAGE:$REVISION"
          python scripts/smoke.py --url http://127.0.0.1:18000 --revision "$REVISION"
      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: kingwooseok
          password: ${{ secrets.KINGWOOSEOK }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$REVISION"
          docker tag "$IMAGE:$REVISION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Write CI summary
        if: success()
        run: python scripts/ci_summary.py
      - name: Container logs
        if: always()
        run: docker logs assignment-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-results
          path: artifacts/
